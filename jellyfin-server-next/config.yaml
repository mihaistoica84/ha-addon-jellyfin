name: Jellyfin Server (Next)
version: 2.2.0
slug: jellyfinservernext
description: Jellyfin Server add-on built with extra fixes, using its own data in /share/jellyfin-next
url: https://github.com/mihaistoica84/ha-addon-jellyfin/tree/main/jellyfin-server-next
webui: http://[HOST]:[PORT:8096]
arch:
  - aarch64
  - amd64
init: false
map:
  - addon_config:rw
  - share:rw
  - media:rw
  - ssl
video: true
ports:
  8096/tcp: 8096
  8920/tcp: null
ports_description:
  8096/tcp: Jellyfin web and media port
  8920/tcp: Jellyfin TLS port, must be configured in the server first
image: ghcr.io/mihaistoica84/{arch}-jellyfin-server-next
